name: ddaenggeurang
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  google_mobile_ads: ^9.0.0
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter

  # 달력 등 Material 위젯의 한국어 지원
  flutter_localizations:
    sdk: flutter

  lottie: ^3.0.0
  url_launcher: ^6.3.0
  firebase_storage: ^13.4.5
  circular_menu: ^4.0.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.3
  google_sign_in: ^6.2.1

  geolocator: ^13.0.1

  # AI 통신
  http: ^1.2.0

  # 로컬 저장
  shared_preferences:

  # 차트
  fl_chart:

  # 아이콘
  simple_icons: ^16.23.0

  # 알림
  flutter_local_notifications:
  timezone: ^0.11.1

  # 이미지
  image_picker: ^1.2.3

  cupertino_icons: ^1.0.8

  # Flutter SDK가 flutter_localizations와 호환되는 버전을 선택
  intl: any

  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5
  table_calendar: ^3.2.0
  flutter_staggered_animations: ^1.1.1
  share_plus: ^13.2.1
  path_provider: ^2.1.6
  add_2_calendar: ^3.0.1
  local_auth: ^3.0.2
  app_badge_plus: ^1.3.2

  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.14.1"
  flutter_lints: ^6.0.0
  flutter_dotenv: ^5.2.1

# path_provider_android 2.3.x는 jni_flutter를 통해 Android SDK platform 35를
# 요구하는데 이 개발 환경엔 없어서 빌드가 깨진다. JNI를 쓰지 않는 이전
# 버전으로 고정해서 우회.
dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/stickers/
    - assets/avatar/base/
    - assets/avatar/hair/
    - assets/avatar/clothes/
    - assets/avatar/shoes/
    - assets/avatar/hat/
    - assets/avatar/accessory/
    - assets/avatar/pet/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/ddaeng_icon_mark.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ddaeng_icon_mark.png"
